<head>

  <style>
    :root{
      --navy:#1F2A44;
      --white:#FFFFFF;
      --blue:#4DA3FF;
      --bg:#F7F9FC;
      --text:#333333;
      --muted:#6B7280;
      --border: rgba(31,42,68,0.12);
      --shadow: 0 10px 30px rgba(31,42,68,0.08);
      --radius: 16px;
      --max: 1100px;
    }

    *{box-sizing:border-box}
    Html,body{margin:0;padding:0}
    Body{
      Font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, “Apple Color Emoji”,”Segoe UI Emoji”;
      Color: var(--text);
      Background: var(--bg);
      Line-height: 1.55;
    }

    A{color:inherit}
    .container{
      Width: min(var(--max), calc(100% - 40px));
      Margin: 0 auto;
    }

    /* ---------- Header / Hero ---------- */
    Header{
      Background: var(--white);
      Border-bottom: 1px solid var(--border);
    }

    .hero{
      Display:grid;
      Grid-template-columns: 1.1fr 0.9fr;
      Gap: 28px;
      Padding: 56px 0;
      Align-items:center;
    }

    .badge{
      Display:inline-flex;
      Gap:10px;
      Align-items:center;
      Padding: 8px 12px;
      Border: 1px solid var(--border);
      Border-radius: 999px;
      Color: var(--navy);
      Background: rgba(77,163,255,0.08);
      Font-size: 14px;
      Font-weight: 600;
    }

    H1{
      Margin: 14px 0 10px;
      Font-size: clamp(34px, 4.2vw, 52px);
      Line-height: 1.1;
      Letter-spacing: -0.02em;
      Color: var(--navy);
    }

    .role{
      Margin: 0 0 10px;
      Font-size: 16px;
      Color: var(--navy);
      Font-weight: 600;
    }

    .subtitle{
      Margin: 0 0 16px;
      Color: var(--muted);
      Font-size: 16px;
      Max-width: 60ch;
    }

    .meta{
      Margin: 0 0 22px;
      Color: var(--text);
      Font-weight: 600;
    }

    .actions{
      Display:flex;
      Gap: 12px;
      Flex-wrap: wrap;
      Align-items:center;
    }

    .btn{
      Display:inline-flex;
      Align-items:center;
      Justify-content:center;
      Gap:10px;
      Padding: 12px 16px;
      Border-radius: 12px;
      Border: 1px solid transparent;
      Text-decoration:none;
      Font-weight: 700;
      Font-size: 15px;
      Cursor:pointer;
      Transition: transform .06s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
      User-select:none;
      White-space: nowrap;
    }
    .btn:active{transform: translateY(1px)}

    .btn-primary{
      Background: var(--blue);
      Color: var(--white);
      Box-shadow: 0 10px 20px rgba(77,163,255,0.22);
    }
    .btn-primary:hover{box-shadow: 0 14px 30px rgba(77,163,255,0.26)}

    .btn-secondary{
      Background: var(--white);
      Color: var(--navy);
      Border-color: var(--border);
    }
    .btn-secondary:hover{border-color: rgba(31,42,68,0.22)}

    .hero-card{
      Border: 1px solid var(--border);
      Border-radius: var(--radius);
      Overflow:hidden;
      Background: var(--white);
      Box-shadow: var(--shadow);
    }

    .hero-image{
      Width: 100%;
      Aspect-ratio: 4/3;
      Object-fit: cover;
      Display:block;
      Filter: saturate(0.98) contrast(1.02);
    }

    .hero-card-footer{
      Padding: 14px 16px 16px;
      Border-top: 1px solid var(--border);
      Color: var(--muted);
      Font-size: 14px;
    }

    /* ---------- Sections ---------- */
    Main{padding: 34px 0 70px}
    Section{
      Margin-top: 26px;
      Background: var(--white);
      Border: 1px solid var(--border);
      Border-radius: var(--radius);
      Box-shadow: var(--shadow);
    }
    .section-inner{
      Padding: 26px;
    }

    H2{
      Margin: 0 0 14px;
      Color: var(--navy);
      Font-size: 22px;
      Letter-spacing: -0.01em;
    }

    .two-col{
      Display:grid;
      Grid-template-columns: 1fr 1fr;
      Gap: 18px;
      Align-items:start;
    }

    .about-text p{
      Margin: 0 0 12px;
      Color: var(--text);
      Max-width: 75ch;
    }
    .about-text p:last-child{margin-bottom:0}

    .about-visual{
      Border-radius: 14px;
      Overflow:hidden;
      Border: 1px solid var(--border);
      Background: #eef4ff;
      Min-height: 220px;
    }
    .about-visual img{
      Width:100%;
      Height:100%;
      Object-fit:cover;
      Display:block;
    }

    /* Services */
    .grid{
      Display:grid;
      Grid-template-columns: repeat(2, minmax(0,1fr));
      Gap: 12px;
    }

    .service{
      Border: 1px solid var(--border);
      Border-radius: 14px;
      Padding: 14px 14px;
      Display:flex;
      Gap: 12px;
      Align-items:flex-start;
      Background: #fff;
    }

    .icon{
      Width: 36px;
      Height: 36px;
      Border-radius: 12px;
      Background: rgba(77,163,255,0.12);
      Display:grid;
      Place-items:center;
      Flex: 0 0 auto;
      Border: 1px solid rgba(77,163,255,0.25);
    }
    .service strong{
      Display:block;
      Color: var(--navy);
      Margin-bottom: 2px;
      Font-size: 15px;
    }
    .service span{
      Display:block;
      Color: var(--muted);
      Font-size: 13.5px;
      Margin-top: 2px;
    }

    /* Portfolio */
    .portfolio-grid{
      Display:grid;
      Grid-template-columns: repeat(3, minmax(0, 1fr));
      Gap: 14px;
    }

    .card{
      Border: 1px solid var(--border);
      Border-radius: 16px;
      Padding: 16px;
      Background: var(--white);
      Display:flex;
      Flex-direction:column;
      Gap: 10px;
      Min-height: 185px;
    }

    .card h3{
      Margin: 0;
      Color: var(--navy);
      Font-size: 16px;
      Letter-spacing: -0.01em;
    }
    .card p{
      Margin: 0;
      Color: var(--muted);
      Font-size: 14px;
    }

    .card .card-actions{
      Margin-top: auto;
      Display:flex;
      Gap: 10px;
      Align-items:center;
      Flex-wrap:wrap;
    }

    .btn-small{
      Padding: 10px 12px;
      Border-radius: 12px;
      Font-size: 14px;
      Font-weight: 700;
    }

    .pill{
      Display:inline-flex;
      Align-items:center;
      Gap: 8px;
      Padding: 7px 10px;
      Border-radius: 999px;
      Border: 1px solid var(--border);
      Font-size: 13px;
      Color: var(--navy);
      Background: rgba(31,42,68,0.03);
      Font-weight: 650;
    }

    /* Background section */
    .timeline{
      Display:grid;
      Gap: 12px;
    }
    .job{
      Border: 1px solid var(--border);
      Border-radius: 14px;
      Padding: 14px 14px;
      Background: #fff;
    }
    .job-head{
      Display:flex;
      Gap: 10px;
      Flex-wrap:wrap;
      Align-items:baseline;
      Justify-content:space-between;
    }
    .job-title{
      Color: var(--navy);
      Font-weight: 800;
    }
    .job-meta{
      Color: var(--muted);
      Font-weight: 650;
      Font-size: 13.5px;
    }
    .job p{
      Margin: 8px 0 0;
      Color: var(--text);
      Font-size: 14.5px;
    }

    /* Contact */
    .contact{
      Display:grid;
      Grid-template-columns: 1fr 1fr;
      Gap: 12px;
    }
    .contact-item{
      Border: 1px solid var(--border);
      Border-radius: 14px;
      Padding: 14px;
      Background: #fff;
    }
    .label{
      Display:block;
      Font-size: 12.5px;
      Color: var(--muted);
      Font-weight: 700;
      Letter-spacing: .02em;
      Text-transform: uppercase;
      Margin-bottom: 6px;
    }
    .value{
      Font-weight: 750;
      Color: var(--navy);
      Word-break: break-word;
    }
    .value a{color: var(--navy); text-decoration: none}
    .value a:hover{text-decoration: underline}

    Footer{
      Padding: 18px 0 26px;
      Color: var(--muted);
      Font-size: 13.5px;
      Text-align:center;
    }

    /* Responsive */
    @media (max-width: 980px){
      .hero{grid-template-columns: 1fr; padding: 44px 0;}
      .two-col{grid-template-columns: 1fr}
      .portfolio-grid{grid-template-columns: repeat(2, minmax(0,1fr))}
      .contact{grid-template-columns: 1fr}
    }
    @media (max-width: 560px){
      .grid{grid-template-columns: 1fr}
      .portfolio-grid{grid-template-columns: 1fr}
      .section-inner{padding: 20px}
    }
  </style>
</head>
